name: eventbq
description: EventBQ - Tu espacio para encontrarnos, hablar y celebrar juntos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Tipografía de las capturas (parece "Lexend"). Descarga los .ttf, ponlos en
  # assets/fonts/ y descomenta este bloque (ver README).
